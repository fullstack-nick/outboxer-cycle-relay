spring:
  application:
    name: central-cycle-service
  datasource:
    url: ${CENTRAL_JDBC_URL:jdbc:postgresql://localhost:15432/outboxer}
    username: ${POSTGRES_APP_USERNAME:outboxer_app}
    password: ${POSTGRES_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  r2dbc:
    url: ${CENTRAL_R2DBC_URL:r2dbc:postgresql://localhost:15432/outboxer}
    username: ${POSTGRES_APP_USERNAME:outboxer_app}
    password: ${POSTGRES_APP_PASSWORD:}
    pool:
      initial-size: 1
      max-size: 8
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: outboxer-cycle-store
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 250
      properties:
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    listener:
      type: batch
      ack-mode: batch
      concurrency: 3
  lifecycle:
    timeout-per-shutdown-phase: 30s
  webflux:
    problemdetails:
      enabled: true

server:
  port: ${CENTRAL_HTTP_PORT:18080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      status:
        order: fatal,down,out-of-service,degraded,unknown,up
        http-mapping:
          down: 503
          out-of-service: 503
          degraded: 503
      group:
        readiness:
          include: readinessState,db,uplinkMqtt
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

outboxer:
  central:
    future-clock-tolerance-seconds: ${CENTRAL_FUTURE_CLOCK_TOLERANCE_SECONDS:300}
    halt-after-database-commit-count: ${CENTRAL_FAULT_HALT_AFTER_DATABASE_COMMIT_COUNT:0}
    receipt-delay-millis: ${CENTRAL_FAULT_RECEIPT_DELAY_MILLIS:0}
    ingress-shards: ${CENTRAL_INGRESS_SHARDS:64}
    ingress-queue-capacity: ${CENTRAL_INGRESS_QUEUE_CAPACITY:1000}
    mqtt:
      host: ${UPLINK_MQTT_HOST:localhost}
      port: ${UPLINK_MQTT_PORT:11884}
      username: ${UPLINK_MQTT_USERNAME:central-uplink}
      password: ${UPLINK_MQTT_PASSWORD:}
      client-id: ${UPLINK_MQTT_CLIENT_ID:outboxer-central-uplink}

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    io.netty: WARN
    org.apache.kafka: WARN
