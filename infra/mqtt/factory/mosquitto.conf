allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0
protocol mqtt
max_packet_size 65536
# Keep a safety margin below each application client's advertised Receive Maximum.
# This also bounds reconnect bursts while persistent QoS 1 sessions are resumed.
max_inflight_messages 250
max_queued_messages 200000

persistence true
persistence_location /mosquitto/data/
autosave_interval 5
autosave_on_changes true
persistent_client_expiration 14d

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
